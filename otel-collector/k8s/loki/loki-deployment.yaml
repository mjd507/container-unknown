apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.2.0
          ports:
            - containerPort: 3100
          args:
            - -config.file=/etc/loki/loki-local-config.yaml
          volumeMounts:
            - name: loki-config
              mountPath: /etc/loki
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: loki-config
          configMap:
            name: otel-loki-config
            items:
              - key: loki-local-config.yaml
                path: loki-local-config.yaml